apiVersion: v1
kind: Service
metadata:
  name: message-board
  namespace: firman-demo
  labels:
    app: message-board
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: /metrics
    prometheus.io/port: "80"
spec:
  type: ClusterIP
  selector:
    app: message-board
  ports:
    - name: http
      port: 80
      targetPort: http
